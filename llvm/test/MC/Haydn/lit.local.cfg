config.suffixes = ['.s']

# Pointer-only ledger lives next to tests; never treat it as a lit test.
config.excludes = set(getattr(config, 'excludes', set())) | {
    'XFAIL-OWNER-LEDGER.txt',
}

# Golden canonical-vector ledger availability: the Format E / sched importer
# --check gates need format_e_canonical_vectors_v1.json, which exists only on
# the plans machine (and must be regenerated against the repaired golden).
# Tests that drive those checks REQUIRE this feature so they run where the
# ledger lives and report unsupported elsewhere, instead of failing on the
# environment.
import os as _os
_golden = _os.environ.get("HAYDN_GOLDEN_DIR") or _os.environ.get("BUNDLESIM_GOLDEN_DIR")
# Feature detection reads os.environ; RUN commands use config.environment.
for _k in ("HAYDN_GOLDEN_DIR", "BUNDLESIM_GOLDEN_DIR"):
    _v = _os.environ.get(_k)
    if _v:
        config.environment[_k] = _v
_candidates = []
if _golden:
    _candidates += [_golden, _os.path.join(_golden, "golden")]
for _d in _candidates:
    if _os.path.isfile(_os.path.join(_d, "format_e_canonical_vectors_v1.json")):
        config.available_features.add("haydn-golden-canonical")
        break

# Occupancy --check needs tblgen HaydnGenFormats.inc so AlternateInsts-only
# (one MultiSlot_Pseudo row) cannot satisfy MIN_OCCUPANCY_ROWS.
_obj = getattr(config, "llvm_obj_root", None)
if _obj:
    config.environment["HAYDN_GEN_FORMATS"] = _os.path.join(
        _obj, "lib", "Target", "Haydn", "HaydnGenFormats.inc")
